[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "drix"
dynamic = ["version"]
description = "Find risky package dependencies and version conflicts across Python, Conda, and APT."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Tien Du" }]
dependencies = [
  "packaging>=24.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
binary = [
  "pyinstaller>=6.22,<7",
]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.7",
  "mypy==2.3.1",
  "types-PyYAML==6.0.12.20260906",
]

[project.scripts]
drix = "drix.main:main"

[tool.hatch.version]
path = "src/drix/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/drix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Keep the lint contract explicit so Ruff releases cannot silently change CI policy.
select = ["E4", "E7", "E9", "F", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
